server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Prerendered Russian landing (полный HTML для SEO)
    location = / {
        try_files /index.html =404;
    }

    # Prerendered локализованные лендинги
    location ~ ^/(en|es|th)/?$ {
        try_files /$1/index.html =404;
    }

    # SPA: остальные маршруты — оболочка без пререндера (избегает гидрационных конфликтов)
    location / {
        try_files $uri $uri/ /index-shell.html;
        add_header Cache-Control "no-cache";
    }
    
    # Кэширование статических ресурсов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Отключаем вывод версии nginx
    server_tokens off;
}
