version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nda_sla_generator}
      POSTGRES_USER: ${POSTGRES_USER:-nda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # Strongly recommend providing a strong password via secrets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: ...
    networks:
      - nda-network

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}  # Crucial: use registry image + tag
    container_name: nda-backend
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/nda/backend.env}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nda-network
    command: sh -c "npx prisma migrate deploy && npm start"

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: nda-frontend
    restart: unless-stopped
    ports:
      - "5173:80"  # or your actual external port
    depends_on:
      - backend
    networks:
      - nda-network

volumes:
  postgres_data:

networks:
  nda-network:
    driver: bridge