name: Deploy to VPS

# Деплой не параллелится с CI: срабатывает только после успешного завершения CI для push в main.
# Ручной запуск (workflow_dispatch) по-прежнему доступен для экстренных случаев.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            cd backend
            npm ci
            npm run build
            npx prisma migrate deploy
            cd ../frontend
            npm ci
            npm run build
            cd ..
            pm2 restart nda-backend --update-env
